name: gerador-de-provas-tests

services:
  tests:
    build:
      context: .
    environment:
      APP_ENV: test
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: gerador_de_provas_test
      DB_USERNAME: gerador_test
      DB_PASSWORD: test-only-password
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - composer db:migrate && composer db:seed && composer test

  mysql:
    image: mysql:8.4.11@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    environment:
      MYSQL_DATABASE: gerador_de_provas_test
      MYSQL_USER: gerador_test
      # Credenciais descartáveis, exclusivas desta rede de testes sem portas publicadas.
      MYSQL_PASSWORD: test-only-password
      MYSQL_ROOT_PASSWORD: test-only-root-password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1 --connect-timeout=3
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1" --silent --skip-column-names > /dev/null 2>&1
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
