# Complemento opcional: docker compose -f compose.yaml -f compose.frontend.yaml up --build -d --wait web
# Para testar sem IA real, prefira o perfil frontend de compose.demo.yaml.
services:
  web:
    build:
      context: ./frontend
      args:
        VITE_API_MODE: local
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    environment:
      API_UPSTREAM: http://app:8080
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
